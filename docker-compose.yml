# Each project has its own docker-compose.yml; `cd <folder> && docker compose up` runs one.
# This file includes all three so they can also be started from the repo root:
#   docker compose up claims-autocomplete   # http://localhost:5173 (API proxied under /api)
#   docker compose up collab-editor         # http://localhost:5174
#   docker compose up object-storage        # http://localhost:5175
#   docker compose up                       # all three
# Real AI is optional: put OPENROUTER_API_KEY in .env (see .env.example).

include:
  - claims-autocomplete/docker-compose.yml
  - collab-editor/docker-compose.yml
  - object-storage/docker-compose.yml
